name: Deploy Longstory to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --production=false

      - name: Build
        run: npm run build

      - name: Upload dist via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          source: "dist"
          target: "/root/longstory"

      - name: Configure nginx and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          command_timeout: 5m
          script: |
            set -e
            echo "=== nginx.conf content ==="
            cat -n /etc/nginx/nginx.conf
            echo "=== sites-available/stars content ==="
            cat -n /etc/nginx/sites-available/stars 2>/dev/null || echo "not found"
            echo "=== conf.d contents ==="
            ls -la /etc/nginx/conf.d/ 2>/dev/null || echo "not found"
            echo "=== END DIAG ==="
