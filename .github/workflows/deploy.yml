name: Deploy Longstory to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --production=false

      - name: Build
        run: npm run build

      - name: Upload dist via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          source: "dist"
          target: "/root/longstory"

      - name: Configure nginx and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          command_timeout: 5m
          script: |
            set -e

            # Find nginx config (try common locations)
            NGINX_CONF=""
            for f in /etc/nginx/conf.d/default.conf /etc/nginx/sites-enabled/default /etc/nginx/nginx.conf; do
              if [ -f "$f" ]; then
                NGINX_CONF="$f"
                break
              fi
            done

            # If no standard config found, search for the one containing philostars
            if [ -z "$NGINX_CONF" ]; then
              NGINX_CONF=$(grep -rl 'philostars\|stars' /etc/nginx/ 2>/dev/null | head -1)
            fi

            echo "=== Using nginx config: $NGINX_CONF ==="

            if [ -z "$NGINX_CONF" ]; then
              echo "WARNING: Could not find nginx config, skipping nginx setup"
              echo "=== deploy complete (nginx manual setup needed) ==="
              exit 0
            fi

            # Add longstory nginx location if not already present
            if ! grep -q '/longstory/' "$NGINX_CONF"; then
              echo "=== Adding /longstory/ location to nginx ==="
              # Create a separate config file for longstory
              cat > /etc/nginx/conf.d/longstory.conf << 'NGXEOF'
            # longstory static frontend
            server {
                listen 80;
                server_name philostars.top;

                location /longstory/ {
                    alias /root/longstory/dist/;
                    try_files $uri $uri/ /longstory/index.html;
                }
            }
            NGXEOF
              # Actually, better to add location block to existing server config
              rm -f /etc/nginx/conf.d/longstory.conf
              # Insert location block before the last } in the config
              sed -i '/^}/i \    # longstory static frontend\n    location /longstory/ {\n        alias /root/longstory/dist/;\n        try_files $uri $uri/ /longstory/index.html;\n    }' "$NGINX_CONF"
              nginx -t && systemctl reload nginx
              echo "=== nginx configured ==="
            else
              echo "=== nginx already configured, reloading ==="
              nginx -t && systemctl reload nginx
            fi

            echo "=== deploy complete ==="
