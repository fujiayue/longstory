name: Deploy Longstory to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --production=false

      - name: Build
        run: npm run build

      - name: Upload dist via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          source: "dist"
          target: "/root/longstory"

      - name: Configure nginx and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          command_timeout: 5m
          script: |
            set -e

            echo "=== Step 1: Dump current HTTPS config for reference ==="
            cat -n /etc/nginx/conf.d/philostars.conf 2>/dev/null || echo "philostars.conf not found"
            echo "=== END DUMP ==="

            echo "=== Step 2: Add longstory location to HTTPS config ==="
            HTTPS_CONF="/etc/nginx/conf.d/philostars.conf"
            if [ -f "$HTTPS_CONF" ]; then
              # Check if longstory block already exists
              if grep -q 'location /longstory/' "$HTTPS_CONF"; then
                echo "longstory location already exists in HTTPS config, removing old one first"
              fi

              python3 << 'PYEOF'
            conf_path = "/etc/nginx/conf.d/philostars.conf"
            with open(conf_path, "r") as f:
                lines = f.readlines()

            # Step A: Remove any existing longstory blocks
            cleaned = []
            skip = False
            for line in lines:
                if "longstory" in line and "location" in line:
                    skip = True
                    continue
                if skip:
                    if line.strip() == "}":
                        skip = False
                        continue
                    continue
                # Also skip comment lines about longstory
                if "# longstory" in line:
                    continue
                cleaned.append(line)

            # Step B: Find the right insertion point
            # Insert BEFORE the catch-all "location / {" in the HTTPS server block
            # We need to find "location / {" that is NOT "location /longstory"
            # and NOT "location /analytics" etc.
            final = []
            inserted = False
            for line in cleaned:
                stripped = line.strip()
                # Match "location / {" exactly (the catch-all proxy)
                if not inserted and (stripped == "location / {" or stripped == "location /{"):
                    final.append("    # longstory static frontend\n")
                    final.append("    location /longstory/ {\n")
                    final.append("        alias /root/longstory/dist/;\n")
                    final.append("        try_files $uri $uri/ /longstory/index.html;\n")
                    final.append("    }\n")
                    final.append("\n")
                    inserted = True
                final.append(line)

            if not inserted:
                # Fallback: insert before the last closing brace of the file
                # Find the last "}" and insert before it
                for i in range(len(final) - 1, -1, -1):
                    if final[i].strip() == "}":
                        final.insert(i, "\n    # longstory static frontend\n")
                        final.insert(i + 1, "    location /longstory/ {\n")
                        final.insert(i + 2, "        alias /root/longstory/dist/;\n")
                        final.insert(i + 3, "        try_files $uri $uri/ /longstory/index.html;\n")
                        final.insert(i + 4, "    }\n")
                        inserted = True
                        break

            with open(conf_path, "w") as f:
                f.writelines(final)

            print(f"Inserted longstory block: {inserted}")
            PYEOF
              echo "=== HTTPS config updated ==="
            else
              echo "WARNING: $HTTPS_CONF not found!"
            fi

            echo "=== Step 3: Verify updated HTTPS config ==="
            cat -n /etc/nginx/conf.d/philostars.conf 2>/dev/null || echo "not found"

            echo "=== Step 4: Test and reload ==="
            nginx -t
            systemctl reload nginx
            echo "=== Deploy complete ==="
