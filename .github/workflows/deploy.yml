name: Deploy Longstory to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --production=false

      - name: Build
        run: npm run build

      - name: Upload dist via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          source: "dist"
          target: "/root/longstory"

      - name: Configure nginx and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          command_timeout: 5m
          script: |
            set -e

            # === Step 1: Fix file permissions ===
            # nginx worker runs as www-data/nginx, needs read access to /root/longstory/
            echo "=== Setting file permissions ==="
            chmod 755 /root
            chmod -R 755 /root/longstory
            echo "Permissions set"

            # === Step 2: Verify files exist ===
            echo "=== Checking deployed files ==="
            ls -la /root/longstory/dist/ | head -20
            test -f /root/longstory/dist/index.html && echo "index.html exists" || echo "ERROR: index.html missing!"

            # === Step 3: Ensure longstory location in HTTPS config ===
            HTTPS_CONF="/etc/nginx/conf.d/philostars.conf"
            if [ -f "$HTTPS_CONF" ]; then
              if grep -q 'location /longstory/' "$HTTPS_CONF"; then
                echo "longstory location already in HTTPS config, skipping"
              else
                echo "Adding longstory location to HTTPS config"
                python3 << 'PYEOF'
            conf_path = "/etc/nginx/conf.d/philostars.conf"
            with open(conf_path, "r") as f:
                lines = f.readlines()
            final = []
            inserted = False
            for line in lines:
                stripped = line.strip()
                if not inserted and (stripped == "location / {" or stripped == "location /{"):
                    final.append("    # longstory static frontend\n")
                    final.append("    location /longstory/ {\n")
                    final.append("        alias /root/longstory/dist/;\n")
                    final.append("        try_files $uri $uri/ /longstory/index.html;\n")
                    final.append("    }\n")
                    final.append("\n")
                    inserted = True
                final.append(line)
            with open(conf_path, "w") as f:
                f.writelines(final)
            print(f"Inserted: {inserted}")
            PYEOF
              fi
            fi

            # === Step 4: Test and reload ===
            nginx -t
            systemctl reload nginx
            echo "=== Deploy complete ==="
